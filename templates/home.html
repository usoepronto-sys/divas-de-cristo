<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Divas de Cristo</title>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#0d0d0d;
            color:#fff;
            font-family:'Montserrat', sans-serif;
        }

        header{
            position:fixed;
            width:100%;
            top:0;
            z-index:1000;
            background:rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            border-bottom:1px solid rgba(255,255,255,0.08);
        }

        .navbar{
            max-width:1300px;
            margin:auto;
            padding:22px 30px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-family:'Playfair Display', serif;
            font-size:34px;
            color:#d4af37;
            letter-spacing:2px;
        }

        .menu{
            display:flex;
            gap:30px;
        }

        .menu a{
            color:#fff;
            text-decoration:none;
            font-size:14px;
            letter-spacing:1px;
            transition:0.3s;
        }

        .menu a:hover{
            color:#d4af37;
        }

        .hero{

            height:100vh;

            background:
            linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.75)),
            url('https://images.unsplash.com/photo-1496747611176-843222e1e57c?q=80&w=1600&auto=format&fit=crop');

            background-size:cover;
            background-position:center;

            display:flex;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:20px;
        }

        .hero-content{
            max-width:900px;
        }

        .hero h1{
            font-size:88px;
            font-family:'Playfair Display', serif;
            margin-bottom:20px;
        }

        .hero p{
            font-size:22px;
            color:#ddd;
            margin-bottom:35px;
        }

        .btn{

            display:inline-block;

            background:#d4af37;
            color:#000;

            padding:16px 34px;

            text-decoration:none;
            border-radius:40px;

            font-weight:600;

            transition:0.3s;
        }

        .btn:hover{
            transform:scale(1.05);
            background:#f1cd5b;
        }

        .section{
            max-width:1300px;
            margin:auto;
            padding:100px 30px;
        }

        .section-title{
            text-align:center;
            margin-bottom:60px;
        }

        .section-title h2{
            font-size:54px;
            font-family:'Playfair Display', serif;
            color:#d4af37;
        }

        .produtos-grid{

            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
            gap:30px;
        }

        .produto-card{

            background:#151515;
            border-radius:20px;
            overflow:hidden;

            transition:0.4s;

            border:1px solid rgba(255,255,255,0.05);
        }

        .produto-card:hover{
            transform:translateY(-10px);
            border-color:#d4af37;
        }

        .produto-card img{
            width:100%;
            height:380px;
            object-fit:cover;
        }

        .produto-info{
            padding:25px;
        }

        .produto-info h3{
            font-size:24px;
            margin-bottom:10px;
            font-family:'Playfair Display', serif;
        }

        .produto-info p{
            color:#bbb;
            margin-bottom:18px;
            line-height:1.6;
        }

        .preco{
            color:#d4af37;
            font-size:24px;
            font-weight:bold;
        }

        .whatsapp{

            position:fixed;

            right:25px;
            bottom:25px;

            width:70px;
            height:70px;

            background:#25d366;

            border-radius:50%;

            display:flex;
            justify-content:center;
            align-items:center;

            font-size:34px;

            text-decoration:none;

            box-shadow:0 0 20px rgba(0,0,0,0.4);

            z-index:999;
        }

        @media(max-width:768px){

            .hero h1{
                font-size:52px;
            }

            .hero p{
                font-size:18px;
            }

            .menu{
                display:none;
            }

        }

    </style>

</head>

<body>

<header>

    <div class="navbar">

        <div class="logo">
            Divas de Cristo
        </div>

        <nav class="menu">
            <a href="">Início</a>
            <a href="">Coleções</a>
            <a href="">Destaques</a>
            <a href="">Contato</a>
        </nav>

    </div>

</header>

<section class="hero">

    <div class="hero-content">

        <h1>Elegância com Propósito</h1>

        <p>
            Moda clássica e sofisticada para mulheres extraordinárias.
        </p>

        <a class="btn" href="#produtos">
            Ver Coleção
        </a>

    </div>

</section>

<section class="section" id="produtos">

    <div class="section-title">
        <h2>Nossos Produtos</h2>
    </div>

    <div class="produtos-grid">

        {% for produto in produtos %}

        <div class="produto-card">

            <img src="{{ produto.imagem.url }}" alt="">

            <div class="produto-info">

                <h3>{{ produto.nome }}</h3>

                <p>
                    {{ produto.descricao }}
                </p>

                <div class="preco">
                    R$ {{ produto.preco }}
                </div>

            </div>

        </div>

        {% endfor %}

    </div>

</section>

<a
class="whatsapp"
href="https://wa.me/5519994120578"
target="_blank">
💬
</a>

</body>
</html>
